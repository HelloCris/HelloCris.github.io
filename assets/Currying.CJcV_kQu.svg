<svg viewBox="0 0 680 585" width="100%" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,BlinkMacSystemFont,sans-serif">
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#185FA5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<title>add 函数链式调用与参数累积</title>
<rect x="0" y="0" width="680" height="585" fill="#ffffff"/>
<text x="340" y="38" text-anchor="middle" font-size="15" font-weight="500" fill="#0C447C">add(1)(2)(3) 调用链：参数如何逐层传递</text>
<text x="340" y="60" text-anchor="middle" font-size="12" fill="#5F5E5A">每层返回一个新函数，新函数闭包捕获「已合并的全部参数」</text>
<g>
<rect x="50" y="86" width="580" height="110" rx="12" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="70" y="114" font-size="14" font-weight="500" fill="#0C447C">① add(1) 第一次调用</text>
<text x="70" y="144" font-size="13" fill="#0C447C">add 接收参数，闭包捕获 args</text>
<text x="70" y="174" font-size="12" fill="#185FA5">返回 inner₁，可继续 .( )</text>
<rect x="430" y="131" width="40" height="40" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="450" y="151" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="500" fill="#0C447C">1</text>
</g>
<line x1="340" y1="197" x2="340" y2="220" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="352" y="212" font-size="11" fill="#5F5E5A">返回 inner₁</text>
<g>
<rect x="50" y="221" width="580" height="110" rx="12" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="70" y="249" font-size="14" font-weight="500" fill="#0C447C">② inner₁(2) 第二次调用</text>
<text x="70" y="279" font-size="13" fill="#0C447C">用 [...args, ...[2]] 合并后</text>
<text x="70" y="309" font-size="12" fill="#185FA5">返回 inner₂，可继续 .( )</text>
<rect x="430" y="266" width="40" height="40" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="450" y="286" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="500" fill="#0C447C">1</text>
<rect x="478" y="266" width="40" height="40" rx="6" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
<text x="498" y="286" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="500" fill="#633806">2</text>
</g>
<line x1="340" y1="332" x2="340" y2="355" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="352" y="347" font-size="11" fill="#5F5E5A">返回 inner₂</text>
<g>
<rect x="50" y="356" width="580" height="110" rx="12" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="70" y="384" font-size="14" font-weight="500" fill="#0C447C">③ inner₂(3) 第三次调用</text>
<text x="70" y="414" font-size="13" fill="#0C447C">合并为 [1,2,3]，闭包捕获</text>
<text x="70" y="444" font-size="12" fill="#185FA5">返回 inner₃</text>
<rect x="430" y="401" width="40" height="40" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="450" y="421" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="500" fill="#0C447C">1</text>
<rect x="478" y="401" width="40" height="40" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="498" y="421" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="500" fill="#0C447C">2</text>
<rect x="526" y="401" width="40" height="40" rx="6" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
<text x="546" y="421" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="500" fill="#633806">3</text>
</g>
<line x1="340" y1="467" x2="340" y2="490" stroke="#3B6D11" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="352" y="482" font-size="11" fill="#5F5E5A">取最终值</text>
<g>
<rect x="50" y="491" width="580" height="72" rx="12" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
<text x="70" y="519" font-size="14" font-weight="500" fill="#173404">求值：隐式触发 valueOf / toString</text>
<text x="70" y="546" font-size="13" fill="#27500A">reduce 对闭包 args 求和：1 + 2 + 3 = 6</text>
<rect x="450" y="512" width="150" height="40" rx="8" fill="#ffffff" stroke="#3B6D11" stroke-width="0.5"/>
<text x="525" y="532" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="500" fill="#173404">= 6</text>
</g>
</svg>