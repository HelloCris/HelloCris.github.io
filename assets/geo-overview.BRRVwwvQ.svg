<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 560" width="100%" role="img">
  <title>荣耀官网 GEO 优化整体架构</title>
  <rect x="0" y="0" width="680" height="560" fill="#F7F8FA"/>
  <desc>以三支柱 + 监测闭环展示荣耀官网 GEO 优化整体架构：技术就绪（可抓取）、内容改造（可抽取）、实体权威（可信任），并通过监测闭环持续迭代</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arr-back" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#BA7517" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .t { font-family: var(--font-sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif); font-size: 11px; font-weight: 400; }
      .th { font-family: var(--font-sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif); font-size: 13px; font-weight: 500; }
      .ts { font-family: var(--font-sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif); font-size: 10px; font-weight: 400; }
      .num { font-family: var(--font-sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif); font-size: 11px; font-weight: 600; text-anchor: middle; dominant-baseline: central; }
    </style>
  </defs>

  <text class="th" x="340" y="26" text-anchor="middle" fill="#2C2C2A" font-size="15">荣耀官网 GEO 优化整体架构</text>
  <text class="ts" x="340" y="44" text-anchor="middle" fill="#6B6A64">三支柱（可抓取 → 可抽取 → 可信任）+ 监测闭环持续迭代</text>

  <!-- 三支柱容器 -->
  <!-- ① 可抓取 -->
  <rect x="15" y="62" width="205" height="330" rx="10" fill="#EAF3DE" stroke="#639922" stroke-width="1.2"/>
  <rect x="15" y="62" width="205" height="42" rx="10" fill="#DCEBC8"/>
  <rect x="15" y="92" width="205" height="12" fill="#DCEBC8"/>
  <circle cx="42" cy="83" r="13" fill="#E24B4A"/>
  <text class="num" x="42" y="83" fill="#ffffff">1</text>
  <text class="th" x="120" y="88" text-anchor="middle" fill="#173404" font-size="14">可抓取（技术就绪）</text>

  <!-- ② 可抽取 -->
  <rect x="238" y="62" width="205" height="330" rx="10" fill="#E7F0F7" stroke="#2F7FB8" stroke-width="1.2"/>
  <rect x="238" y="62" width="205" height="42" rx="10" fill="#CFE3F1"/>
  <rect x="238" y="92" width="205" height="12" fill="#CFE3F1"/>
  <circle cx="265" cy="83" r="13" fill="#E24B4A"/>
  <text class="num" x="265" y="83" fill="#ffffff">2</text>
  <text class="th" x="343" y="88" text-anchor="middle" fill="#0B3D5C" font-size="14">可抽取（内容改造）</text>

  <!-- ③ 可信任 -->
  <rect x="461" y="62" width="205" height="330" rx="10" fill="#F3EAF7" stroke="#8A4FB8" stroke-width="1.2"/>
  <rect x="461" y="62" width="205" height="42" rx="10" fill="#E6D6F2"/>
  <rect x="461" y="92" width="205" height="12" fill="#E6D6F2"/>
  <circle cx="488" cy="83" r="13" fill="#E24B4A"/>
  <text class="num" x="488" y="83" fill="#ffffff">3</text>
  <text class="th" x="566" y="88" text-anchor="middle" fill="#3D1466" font-size="14">可信任（实体权威）</text>

  <!-- 支柱间箭头 -->
  <line x1="222" y1="83" x2="235" y2="83" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="445" y1="83" x2="458" y2="83" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ① 子项 -->
  <g fill="#F7FAF2" stroke="#9BBE6E" stroke-width="1">
    <rect x="33" y="120" width="169" height="64" rx="8"/>
    <rect x="33" y="196" width="169" height="64" rx="8"/>
    <rect x="33" y="272" width="169" height="64" rx="8"/>
  </g>
  <text class="t" x="45" y="140" fill="#173404">① robots.txt 放行</text>
  <text class="t" x="45" y="158" fill="#3B6D11">GPTBot / ClaudeBot /</text>
  <text class="t" x="45" y="174" fill="#3B6D11">PerplexityBot 等</text>
  <text class="t" x="45" y="216" fill="#173404">② SSR / 静态 HTML</text>
  <text class="t" x="45" y="234" fill="#3B6D11">核心内容不依赖</text>
  <text class="t" x="45" y="250" fill="#3B6D11">客户端 JS 渲染</text>
  <text class="t" x="45" y="292" fill="#173404">③ llms.txt 部署</text>
  <text class="t" x="45" y="310" fill="#3B6D11">根目录说明品牌</text>
  <text class="t" x="45" y="326" fill="#3B6D11">定位与核心页面</text>

  <!-- ② 子项 -->
  <g fill="#F2F8FC" stroke="#7FB4D8" stroke-width="1">
    <rect x="256" y="120" width="169" height="64" rx="8"/>
    <rect x="256" y="196" width="169" height="64" rx="8"/>
    <rect x="256" y="272" width="169" height="64" rx="8"/>
  </g>
  <text class="t" x="268" y="140" fill="#0B3D5C">① Answer-first 结构</text>
  <text class="t" x="268" y="158" fill="#13567E">章节开头直接给结论</text>
  <text class="t" x="268" y="174" fill="#13567E">问句式小标题</text>
  <text class="t" x="268" y="216" fill="#0B3D5C">② 结构化数据</text>
  <text class="t" x="268" y="234" fill="#13567E">FAQ / Article / HowTo</text>
  <text class="t" x="268" y="250" fill="#13567E">/ Product JSON-LD</text>
  <text class="t" x="268" y="292" fill="#0B3D5C">③ 对比表 / 清单</text>
  <text class="t" x="268" y="310" fill="#13567E">参数表、TL;DR、</text>
  <text class="t" x="268" y="326" fill="#13567E">FAQ 步骤清单</text>

  <!-- ③ 子项 -->
  <g fill="#F9F4FC" stroke="#BFA0D8" stroke-width="1">
    <rect x="479" y="120" width="169" height="64" rx="8"/>
    <rect x="479" y="196" width="169" height="64" rx="8"/>
    <rect x="479" y="272" width="169" height="64" rx="8"/>
  </g>
  <text class="t" x="491" y="140" fill="#3D1466">① 实体权威</text>
  <text class="t" x="491" y="158" fill="#5B2A8C">Organization sameAs</text>
  <text class="t" x="491" y="174" fill="#5B2A8C">关联权威信源节点</text>
  <text class="t" x="491" y="216" fill="#3D1466">② 品牌信息一致性</text>
  <text class="t" x="491" y="234" fill="#5B2A8C">官网 / 社媒 / 媒体</text>
  <text class="t" x="491" y="250" fill="#5B2A8C">表述统一</text>
  <text class="t" x="491" y="292" fill="#3D1466">③ E-E-A-T</text>
  <text class="t" x="491" y="310" fill="#5B2A8C">署名资质 / 日期 /</text>
  <text class="t" x="491" y="326" fill="#5B2A8C">一手信源 / 第三方提及</text>

  <!-- 底部监测闭环 -->
  <rect x="15" y="408" width="650" height="120" rx="10" fill="#FAEEDA" stroke="#BA7517" stroke-width="1.2"/>
  <text class="th" x="40" y="432" fill="#412402" font-size="13">监测闭环（持续迭代）</text>

  <g fill="#FFFFFF" stroke="#BA7517" stroke-width="1">
    <rect x="40" y="448" width="130" height="46" rx="8"/>
    <rect x="190" y="448" width="130" height="46" rx="8"/>
    <rect x="340" y="448" width="130" height="46" rx="8"/>
    <rect x="490" y="448" width="140" height="46" rx="8"/>
  </g>
  <text class="t" x="105" y="468" text-anchor="middle" fill="#412402">目标问题清单</text>
  <text class="ts" x="105" y="484" text-anchor="middle" fill="#854F0B">决策各阶段问题</text>
  <text class="t" x="255" y="468" text-anchor="middle" fill="#412402">AI 平台自测</text>
  <text class="ts" x="255" y="484" text-anchor="middle" fill="#854F0B">ChatGPT/豆包等</text>
  <text class="t" x="405" y="468" text-anchor="middle" fill="#412402">日志 / referrer</text>
  <text class="ts" x="405" y="484" text-anchor="middle" fill="#854F0B">爬虫频次+引荐</text>
  <text class="t" x="560" y="468" text-anchor="middle" fill="#412402">迭代优化</text>
  <text class="ts" x="560" y="484" text-anchor="middle" fill="#854F0B">更新内容/技术</text>

  <line x1="170" y1="471" x2="188" y2="471" stroke="#BA7517" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="320" y1="471" x2="338" y2="471" stroke="#BA7517" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="470" y1="471" x2="488" y2="471" stroke="#BA7517" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- 闭环回指到三支柱 -->
  <path d="M560 448 C 600 410, 600 380, 566 372" fill="none" stroke="#BA7517" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arr-back)"/>
  <text class="ts" x="612" y="410" fill="#854F0B">反馈</text>
</svg>
