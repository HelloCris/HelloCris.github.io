<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470" width="100%" role="img">
  <title>Nginx 双域名配置流程</title>
  <rect x="0" y="0" width="680" height="470" fill="#ffffff"/>
  <desc>以序列图方式展示 hihonor.com 与 honor.com 双域名共存时的请求转发与重定向流程，所有消息均为水平箭头，无弯曲重叠</desc>
  <defs>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#185FA5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#3B6D11" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .t { font-family: var(--font-sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif); font-size: 12px; font-weight: 400; }
      .th { font-family: var(--font-sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif); font-size: 13px; font-weight: 500; }
      .ts { font-family: var(--font-sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif); font-size: 10px; font-weight: 400; }
      .tl { font-family: var(--font-sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif); font-size: 11px; font-weight: 400; }
      .num { font-family: var(--font-sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif); font-size: 11px; font-weight: 500; text-anchor: middle; dominant-baseline: central; }
    </style>
  </defs>

  <text class="th" x="340" y="22" text-anchor="middle" fill="#2C2C2A" font-size="15">Nginx 双域名配置流程（序列图）</text>
  <text class="tl" x="340" y="38" text-anchor="middle" fill="#888780">保留 hihonor.com，新增 honor.com；Nginx 缓存 honor.com 页面并统一转发</text>

  <g stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 4">
    <line x1="92" y1="90" x2="92" y2="356"/>
    <line x1="200" y1="90" x2="200" y2="356"/>
    <line x1="308" y1="90" x2="308" y2="356"/>
    <line x1="392" y1="90" x2="392" y2="356"/>
    <line x1="500" y1="90" x2="500" y2="356"/>
    <line x1="608" y1="90" x2="608" y2="356"/>
  </g>

  <g>
    <rect x="46" y="50" width="92" height="42" rx="8" fill="#E6F1FB" stroke="#378ADD" stroke-width="1"/>
    <text class="tl" x="92" y="66" text-anchor="middle" fill="#042C53">hihonor.com</text>
    <text class="ts" x="92" y="80" text-anchor="middle" fill="#185FA5">浏览器</text>

    <rect x="154" y="50" width="92" height="42" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
    <text class="th" x="200" y="66" text-anchor="middle" fill="#2C2C2A">Nginx</text>
    <text class="ts" x="200" y="80" text-anchor="middle" fill="#5F5E5A">缓存 · 转发</text>

    <rect x="262" y="50" width="92" height="42" rx="8" fill="#EAF3DE" stroke="#639922" stroke-width="1"/>
    <text class="tl" x="308" y="66" text-anchor="middle" fill="#173404">honor.com</text>
    <text class="ts" x="308" y="80" text-anchor="middle" fill="#3B6D11">Web 服务</text>
  </g>

  <g>
    <rect x="346" y="50" width="92" height="42" rx="8" fill="#EAF3DE" stroke="#639922" stroke-width="1"/>
    <text class="tl" x="392" y="66" text-anchor="middle" fill="#173404">honor.com</text>
    <text class="ts" x="392" y="80" text-anchor="middle" fill="#3B6D11">浏览器</text>

    <rect x="454" y="50" width="92" height="42" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
    <text class="th" x="500" y="66" text-anchor="middle" fill="#2C2C2A">Nginx</text>
    <text class="ts" x="500" y="80" text-anchor="middle" fill="#5F5E5A">缓存 · 转发</text>

    <rect x="562" y="50" width="92" height="42" rx="8" fill="#EAF3DE" stroke="#639922" stroke-width="1"/>
    <text class="tl" x="608" y="66" text-anchor="middle" fill="#173404">honor.com</text>
    <text class="ts" x="608" y="80" text-anchor="middle" fill="#3B6D11">Web 服务</text>
  </g>

  <g>
    <rect x="240" y="356" width="416" height="86" rx="16" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
    <text class="th" x="448" y="378" text-anchor="middle" fill="#2C2C2A">honor.com 服务</text>
    <rect x="256" y="392" width="84" height="42" rx="6" fill="#D3D1C7" stroke="#888780" stroke-width="0.5"/>
    <text class="t" x="298" y="414" text-anchor="middle" fill="#2C2C2A">品牌</text>
    <rect x="356" y="392" width="84" height="42" rx="6" fill="#D3D1C7" stroke="#888780" stroke-width="0.5"/>
    <text class="t" x="398" y="414" text-anchor="middle" fill="#2C2C2A">服务</text>
    <rect x="456" y="392" width="84" height="42" rx="6" fill="#D3D1C7" stroke="#888780" stroke-width="0.5"/>
    <text class="t" x="498" y="414" text-anchor="middle" fill="#2C2C2A">电商</text>
    <rect x="556" y="392" width="84" height="42" rx="6" fill="#D3D1C7" stroke="#888780" stroke-width="0.5"/>
    <text class="t" x="598" y="414" text-anchor="middle" fill="#2C2C2A">社区</text>
  </g>

  <g>
    <line x1="92" y1="120" x2="200" y2="120" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arr-blue)"/>
    <circle cx="146" cy="120" r="9" fill="#185FA5"/>
    <text class="num" x="146" y="120" fill="#ffffff">1</text>
    <text class="tl" x="146" y="108" text-anchor="middle" fill="#042C53">访问 hihonor.com 域名</text>

    <line x1="200" y1="152" x2="92" y2="152" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arr-blue)"/>
    <circle cx="146" cy="152" r="9" fill="#185FA5"/>
    <text class="num" x="146" y="152" fill="#ffffff">2</text>
    <text class="tl" x="146" y="140" text-anchor="middle" fill="#042C53">重定向到 honor.com</text>

    <line x1="92" y1="184" x2="200" y2="184" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arr-blue)"/>
    <circle cx="146" cy="184" r="9" fill="#185FA5"/>
    <text class="num" x="146" y="184" fill="#ffffff">3</text>
    <text class="tl" x="146" y="172" text-anchor="middle" fill="#042C53">通过 honor.com 访问</text>

    <line x1="200" y1="216" x2="308" y2="216" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arr-blue)"/>
    <circle cx="254" cy="216" r="9" fill="#185FA5"/>
    <text class="num" x="254" y="216" fill="#ffffff">4</text>
    <text class="tl" x="254" y="204" text-anchor="middle" fill="#042C53">转发到 web 服务</text>

    <line x1="308" y1="248" x2="200" y2="248" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arr-blue)"/>
    <circle cx="254" cy="248" r="9" fill="#185FA5"/>
    <text class="num" x="254" y="248" fill="#ffffff">5</text>
    <text class="tl" x="254" y="236" text-anchor="middle" fill="#042C53">返回 honor.com 页面</text>

    <line x1="200" y1="280" x2="92" y2="280" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arr-blue)"/>
    <circle cx="146" cy="280" r="9" fill="#185FA5"/>
    <text class="num" x="146" y="280" fill="#ffffff">6</text>
    <text class="tl" x="146" y="268" text-anchor="middle" fill="#042C53">返回 honor.com 页面</text>
  </g>

  <g>
    <line x1="392" y1="120" x2="500" y2="120" stroke="#3B6D11" stroke-width="1.5" marker-end="url(#arr-green)"/>
    <circle cx="446" cy="120" r="9" fill="#3B6D11"/>
    <text class="num" x="446" y="120" fill="#ffffff">1</text>
    <text class="tl" x="446" y="108" text-anchor="middle" fill="#173404">访问 honor.com 域名</text>

    <line x1="500" y1="152" x2="608" y2="152" stroke="#3B6D11" stroke-width="1.5" marker-end="url(#arr-green)"/>
    <circle cx="554" cy="152" r="9" fill="#3B6D11"/>
    <text class="num" x="554" y="152" fill="#ffffff">2</text>
    <text class="tl" x="554" y="140" text-anchor="middle" fill="#173404">转发到 web 服务</text>

    <line x1="608" y1="184" x2="500" y2="184" stroke="#3B6D11" stroke-width="1.5" marker-end="url(#arr-green)"/>
    <circle cx="554" cy="184" r="9" fill="#3B6D11"/>
    <text class="num" x="554" y="184" fill="#ffffff">3</text>
    <text class="tl" x="554" y="172" text-anchor="middle" fill="#173404">返回 honor.com 页面</text>

    <line x1="500" y1="216" x2="392" y2="216" stroke="#3B6D11" stroke-width="1.5" marker-end="url(#arr-green)"/>
    <circle cx="446" cy="216" r="9" fill="#3B6D11"/>
    <text class="num" x="446" y="216" fill="#ffffff">4</text>
    <text class="tl" x="446" y="204" text-anchor="middle" fill="#173404">返回 honor.com 页面</text>
  </g>
</svg>