<svg viewBox="0 0 680 380" width="100%" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,BlinkMacSystemFont,sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="680" height="380" fill="#ffffff"/>
  <text class="th" x="40" y="28" font-size="14" font-weight="500" fill="#26215C">Vue 2 transition 类挂载时序</text>
  <text class="ts" x="40" y="48" font-size="12" fill="#5F5E5A">元素插入/移除时，Vue 在关键时刻自动增删 6 个类</text>

  <line x1="300" y1="70" x2="300" y2="312" stroke="#888780" stroke-width="0.5" stroke-dasharray="4 4"/>
  <text class="ts" x="300" y="330" font-size="11" fill="#5F5E5A" text-anchor="middle">下一帧</text>

  <line x1="170" y1="338" x2="170" y2="352" stroke="#888780" stroke-width="0.5" marker-end="url(#arrow)"/>
  <text class="ts" x="170" y="366" font-size="11" fill="#5F5E5A" text-anchor="middle">t0 插入 DOM</text>
  <line x1="540" y1="338" x2="540" y2="352" stroke="#888780" stroke-width="0.5" marker-end="url(#arrow)"/>
  <text class="ts" x="540" y="366" font-size="11" fill="#5F5E5A" text-anchor="middle">动画结束 移除类</text>

  <text class="th" x="40" y="100" font-size="13" font-weight="500" fill="#534AB7">进入</text>
  <text class="th" x="40" y="240" font-size="13" font-weight="500" fill="#993C1D">离开</text>

  <g>
    <rect x="170" y="78" width="370" height="24" rx="6" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
    <text class="ts" x="355" y="90" font-size="11" fill="#0C447C" text-anchor="middle" dominant-baseline="central">v-enter-active（贯穿全程，写 transition 属性）</text>

    <rect x="170" y="108" width="130" height="24" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
    <text class="ts" x="235" y="120" font-size="11" fill="#3C3489" text-anchor="middle" dominant-baseline="central">v-enter 起始态</text>

    <rect x="300" y="138" width="240" height="24" rx="6" fill="#CECBF6" stroke="#534AB7" stroke-width="0.5"/>
    <text class="ts" x="420" y="150" font-size="11" fill="#3C3489" text-anchor="middle" dominant-baseline="central">v-enter-to 目标态</text>
  </g>

  <g>
    <rect x="170" y="218" width="370" height="24" rx="6" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
    <text class="ts" x="355" y="230" font-size="11" fill="#0C447C" text-anchor="middle" dominant-baseline="central">v-leave-active（贯穿全程，写 transition 属性）</text>

    <rect x="170" y="248" width="130" height="24" rx="6" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
    <text class="ts" x="235" y="260" font-size="11" fill="#712B13" text-anchor="middle" dominant-baseline="central">v-leave 起始态</text>

    <rect x="300" y="278" width="240" height="24" rx="6" fill="#F5C4B3" stroke="#993C1D" stroke-width="0.5"/>
    <text class="ts" x="420" y="290" font-size="11" fill="#712B13" text-anchor="middle" dominant-baseline="central">v-leave-to 目标态</text>
  </g>
</svg>