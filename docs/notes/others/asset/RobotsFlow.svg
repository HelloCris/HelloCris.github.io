<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 519" width="680" height="519" role="img">
  <title>爬虫处理 robots.txt 的决策流程</title>
  <desc>从请求 URL 开始，依次判断是否存在 robots.txt、UA 分组匹配、Disallow 命中、Allow 覆盖，最终决定允许或禁止抓取。</desc>
  <style>
    text { font-family: "PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif; }
    .th { font-size:14px; font-weight:500; }
    .ts { font-size:12px; font-weight:400; }
  </style>
  <rect x="0" y="0" width="680" height="519" fill="#ffffff"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <g class="c-blue">
    <rect x="240" y="30" width="200" height="44" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
    <text class="th" x="340" y="52" text-anchor="middle" dominant-baseline="central" fill="#042C53">爬虫请求 /path</text>
  </g>

  <line x1="340" y1="74" x2="340" y2="98" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text class="ts" x="350" y="86" fill="#444441">有</text>

  <g class="c-amber">
    <polygon points="340,100 430,130 340,160 250,130" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
    <text class="th" x="340" y="130" text-anchor="middle" dominant-baseline="central" fill="#412402">有 robots.txt?</text>
  </g>

  <line x1="250" y1="130" x2="190" y2="130" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text class="ts" x="212" y="122" fill="#444441">无</text>

  <g class="c-green">
    <rect x="40" y="110" width="150" height="40" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
    <text class="th" x="115" y="130" text-anchor="middle" dominant-baseline="central" fill="#173404">允许抓取</text>
  </g>

  <line x1="340" y1="160" x2="340" y2="188" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text class="ts" x="350" y="174" fill="#444441">有</text>

  <g class="c-blue">
    <rect x="240" y="190" width="200" height="44" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
    <text class="th" x="340" y="212" text-anchor="middle" dominant-baseline="central" fill="#042C53">匹配 UA 分组</text>
  </g>

  <line x1="340" y1="234" x2="340" y2="263" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g class="c-amber">
    <polygon points="340,265 445,300 340,335 235,300" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
    <text class="th" x="340" y="293" text-anchor="middle" dominant-baseline="central" fill="#412402">路径命中</text>
    <text class="th" x="340" y="311" text-anchor="middle" dominant-baseline="central" fill="#412402">Disallow?</text>
  </g>

  <line x1="235" y1="300" x2="190" y2="300" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text class="ts" x="208" y="292" fill="#444441">未命中</text>

  <g class="c-green">
    <rect x="40" y="280" width="150" height="40" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
    <text class="th" x="115" y="300" text-anchor="middle" dominant-baseline="central" fill="#173404">允许抓取</text>
  </g>

  <line x1="340" y1="335" x2="340" y2="358" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text class="ts" x="350" y="346" fill="#444441">命中</text>

  <g class="c-amber">
    <polygon points="340,360 455,395 340,430 225,395" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
    <text class="th" x="340" y="388" text-anchor="middle" dominant-baseline="central" fill="#412402">存在更具体的</text>
    <text class="th" x="340" y="406" text-anchor="middle" dominant-baseline="central" fill="#412402">Allow?</text>
  </g>

  <line x1="455" y1="395" x2="475" y2="395" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text class="ts" x="460" y="387" fill="#444441">有</text>

  <g class="c-green">
    <rect x="475" y="375" width="150" height="40" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
    <text class="th" x="550" y="395" text-anchor="middle" dominant-baseline="central" fill="#173404">允许抓取</text>
  </g>

  <line x1="340" y1="430" x2="340" y2="453" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text class="ts" x="350" y="441" fill="#444441">无</text>

  <g class="c-red">
    <rect x="265" y="455" width="150" height="44" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
    <text class="th" x="340" y="477" text-anchor="middle" dominant-baseline="central" fill="#501313">禁止抓取</text>
  </g>
</svg>