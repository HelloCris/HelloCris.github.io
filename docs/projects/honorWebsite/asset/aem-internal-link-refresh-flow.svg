<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 670" width="100%" role="img">
  <title>AEM 内链刷新脚本流程</title>
  <rect x="0" y="0" width="680" height="670" fill="#ffffff"/>
  <desc>以序列图方式展示 AEM 内链刷新脚本的三个阶段：站点内链检索刷新、站点发布、缓存清理</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#185FA5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#854F0B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#A32D2D" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .t { font-family: var(--font-sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif); font-size: 11px; font-weight: 400; }
      .th { font-family: var(--font-sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif); font-size: 13px; font-weight: 500; }
      .ts { font-family: var(--font-sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif); font-size: 10px; font-weight: 400; }
      .tl { font-family: var(--font-sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif); font-size: 11px; font-weight: 400; }
    </style>
  </defs>

  <text class="th" x="340" y="24" text-anchor="middle" fill="#2C2C2A" font-size="15">AEM 内链刷新脚本流程</text>

  <g>
    <rect x="35" y="42" width="90" height="42" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
    <text class="tl" x="80" y="58" text-anchor="middle" fill="#2C2C2A">AEM内链</text>
    <text class="tl" x="80" y="74" text-anchor="middle" fill="#2C2C2A">刷新脚本</text>

    <rect x="165" y="42" width="90" height="42" rx="8" fill="#E6F1FB" stroke="#378ADD" stroke-width="1"/>
    <text class="th" x="210" y="70" text-anchor="middle" fill="#042C53">Author</text>

    <rect x="295" y="42" width="90" height="42" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="1"/>
    <text class="th" x="340" y="70" text-anchor="middle" fill="#412402">Publish</text>

    <rect x="425" y="42" width="90" height="42" rx="8" fill="#FCEBEB" stroke="#E24B4A" stroke-width="1"/>
    <text class="th" x="470" y="70" text-anchor="middle" fill="#501313">Dispatcher</text>

    <rect x="555" y="42" width="90" height="42" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="1"/>
    <text class="th" x="600" y="70" text-anchor="middle" fill="#412402">CDN</text>
  </g>

  <g stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 4">
    <line x1="80" y1="84" x2="80" y2="640"/>
    <line x1="210" y1="84" x2="210" y2="640"/>
    <line x1="340" y1="84" x2="340" y2="640"/>
    <line x1="470" y1="84" x2="470" y2="640"/>
    <line x1="600" y1="84" x2="600" y2="640"/>
  </g>

  <g>
    <rect x="30" y="98" width="620" height="200" rx="8" fill="#E6F1FB" stroke="#B5D4F4" stroke-width="0.5" opacity="0.6"/>
    <rect x="270" y="90" width="140" height="26" rx="6" fill="#E6F1FB" stroke="#378ADD" stroke-width="1"/>
    <text class="t" x="340" y="108" text-anchor="middle" fill="#042C53">站点内链检索刷新</text>
    <text class="ts" x="340" y="126" text-anchor="middle" fill="#185FA5">loop · 逐个站点执行</text>
  </g>

  <g>
    <line x1="80" y1="152" x2="210" y2="152" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arr)"/>
    <text class="t" x="145" y="145" text-anchor="middle" fill="#2C2C2A">备份站点</text>

    <line x1="210" y1="180" x2="80" y2="180" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arr-blue)"/>
    <text class="t" x="145" y="173" text-anchor="middle" fill="#0C447C">备份完成</text>

    <line x1="80" y1="208" x2="210" y2="208" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arr)"/>
    <text class="t" x="145" y="201" text-anchor="middle" fill="#2C2C2A">检索站点AEM内链配置</text>

    <line x1="210" y1="236" x2="80" y2="236" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arr-blue)"/>
    <text class="t" x="145" y="229" text-anchor="middle" fill="#0C447C">内链配置检索完成</text>

    <line x1="80" y1="264" x2="210" y2="264" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arr)"/>
    <text class="t" x="145" y="257" text-anchor="middle" fill="#2C2C2A">内链刷新，域名替换</text>

    <line x1="210" y1="292" x2="80" y2="292" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arr-blue)"/>
    <text class="t" x="145" y="285" text-anchor="middle" fill="#0C447C">刷新完成</text>
  </g>

  <rect x="205" y="152" width="10" height="140" rx="2" fill="#85B7EB" opacity="0.8"/>

  <g>
    <rect x="30" y="312" width="620" height="120" rx="8" fill="#FAEEDA" stroke="#FAC775" stroke-width="0.5" opacity="0.6"/>
    <rect x="270" y="304" width="140" height="26" rx="6" fill="#FAEEDA" stroke="#BA7517" stroke-width="1"/>
    <text class="t" x="340" y="322" text-anchor="middle" fill="#412402">站点发布</text>
  </g>

  <g>
    <line x1="80" y1="350" x2="340" y2="350" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arr)"/>
    <text class="t" x="210" y="343" text-anchor="middle" fill="#2C2C2A">发布站点</text>

    <path d="M340 368 L375 368 L375 386 L345 386" fill="none" stroke="#854F0B" stroke-width="1.5" marker-end="url(#arr-amber)"/>
    <text class="t" x="365" y="361" text-anchor="middle" fill="#412402">发布站点</text>

    <line x1="340" y1="404" x2="80" y2="404" stroke="#854F0B" stroke-width="1.5" marker-end="url(#arr-amber)"/>
    <text class="t" x="210" y="397" text-anchor="middle" fill="#412402">发布完成</text>
  </g>

  <rect x="335" y="350" width="10" height="54" rx="2" fill="#EF9F27" opacity="0.7"/>

  <g>
    <rect x="30" y="446" width="620" height="200" rx="8" fill="#EAF3DE" stroke="#C0DD97" stroke-width="0.5" opacity="0.6"/>
    <rect x="270" y="438" width="140" height="26" rx="6" fill="#EAF3DE" stroke="#639922" stroke-width="1"/>
    <text class="t" x="340" y="456" text-anchor="middle" fill="#173404">缓存清理</text>
  </g>

  <g>
    <line x1="80" y1="484" x2="470" y2="484" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arr)"/>
    <text class="t" x="275" y="477" text-anchor="middle" fill="#2C2C2A">清除站点Dispatcher缓存</text>

    <path d="M470 502 L505 502 L505 520 L475 520" fill="none" stroke="#A32D2D" stroke-width="1.5" marker-end="url(#arr-red)"/>
    <text class="t" x="495" y="495" text-anchor="middle" fill="#501313">清除站点Dispatcher缓存</text>

    <line x1="470" y1="538" x2="80" y2="538" stroke="#A32D2D" stroke-width="1.5" marker-end="url(#arr-red)"/>
    <text class="t" x="275" y="531" text-anchor="middle" fill="#501313">Dispatcher缓存清除完成</text>

    <line x1="80" y1="562" x2="600" y2="562" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arr)"/>
    <text class="t" x="340" y="555" text-anchor="middle" fill="#2C2C2A">清除站点CDN缓存</text>

    <path d="M600 580 L635 580 L635 598 L605 598" fill="none" stroke="#854F0B" stroke-width="1.5" marker-end="url(#arr-amber)"/>
    <text class="t" x="625" y="573" text-anchor="middle" fill="#412402">清除站点CDN缓存</text>

    <line x1="600" y1="616" x2="80" y2="616" stroke="#854F0B" stroke-width="1.5" marker-end="url(#arr-amber)"/>
    <text class="t" x="340" y="609" text-anchor="middle" fill="#412402">CDN缓存清除完成</text>
  </g>

  <rect x="465" y="484" width="10" height="54" rx="2" fill="#F09595" opacity="0.8"/>
  <rect x="595" y="562" width="10" height="54" rx="2" fill="#FAC775" opacity="0.8"/>
</svg>