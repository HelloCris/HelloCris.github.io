<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1400 920" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="1400" height="920" fill="#F7F8FA"/>
  <!-- ========== 标题 ========== -->
  <text x="60" y="70" font-size="32" font-weight="700" fill="#333">整体设计</text>

  <!-- ========== Build 区域外框 ========== -->
  <rect x="30" y="120" width="560" height="720" fill="none" stroke="#e8a0a0" stroke-width="2.5" rx="4"/>
  <text x="420" y="175" font-size="44" font-weight="500" fill="#555">build</text>
  <!-- 粉色圆圈 3 -->
  <circle cx="385" cy="155" r="22" fill="#f48fb1"/>
  <text x="385" y="163" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">3</text>

  <!-- ========== core 模块 ========== -->
  <rect x="55" y="220" width="170" height="65" fill="#c9a86c" rx="2"/>
  <text x="140" y="260" font-size="22" fill="#fff" text-anchor="middle" font-weight="500">core</text>

  <!-- Sling Model 2 (绿) -->
  <rect x="290" y="232" width="160" height="34" fill="#4caf50" rx="4"/>
  <text x="370" y="255" font-size="16" fill="#fff" text-anchor="middle">Sling Model 2</text>
  <!-- Sling Model 1 (蓝) -->
  <rect x="290" y="278" width="160" height="34" fill="#4fc3f7" rx="4"/>
  <text x="370" y="301" font-size="16" fill="#fff" text-anchor="middle">Sling Model 1</text>

  <!-- 箭头 core -> Sling Models -->
  <line x1="225" y1="252" x2="285" y2="249" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="225" y1="260" x2="285" y2="295" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ========== ui.apps 模块 ========== -->
  <rect x="55" y="350" width="170" height="65" fill="#c9a86c" rx="2"/>
  <text x="140" y="390" font-size="22" fill="#fff" text-anchor="middle" font-weight="500">ui.apps</text>

  <!-- AEM Component 2 (绿大方块) -->
  <rect x="290" y="340" width="220" height="62" fill="#4caf50" rx="6"/>
  <text x="400" y="365" font-size="16" fill="#fff" text-anchor="middle" font-weight="500">AEM Component 2</text>
  <rect x="340" y="372" width="120" height="24" fill="#388e3c" rx="3"/>
  <text x="400" y="389" font-size="14" fill="#fff" text-anchor="middle">Clientlib</text>

  <!-- AEM Component 1 (蓝大方块) -->
  <rect x="290" y="420" width="220" height="62" fill="#4fc3f7" rx="6"/>
  <text x="400" y="445" font-size="16" fill="#fff" text-anchor="middle" font-weight="500">AEM Component 1</text>
  <rect x="340" y="452" width="120" height="24" fill="#29b6f6" rx="3"/>
  <text x="400" y="469" font-size="14" fill="#fff" text-anchor="middle">Clientlib</text>

  <!-- 箭头 ui.apps -> AEM Components -->
  <line x1="225" y1="375" x2="285" y2="371" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="225" y1="395" x2="285" y2="451" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 粉色圆圈 1 -->
  <circle cx="300" cy="510" r="22" fill="#f48fb1"/>
  <text x="300" y="518" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">1</text>

  <!-- ========== ui.frontend 模块 ========== -->
  <rect x="55" y="540" width="170" height="65" fill="#ffe082" rx="2"/>
  <text x="140" y="580" font-size="22" fill="#5d4037" text-anchor="middle" font-weight="500">ui.frontend</text>

  <!-- Vue Component 1 (蓝长条) -->
  <rect x="290" y="600" width="200" height="32" fill="#4fc3f7" rx="4"/>
  <text x="390" y="622" font-size="15" fill="#fff" text-anchor="middle">Vue Component 1</text>
  <!-- BUILD 标注 -->
  <text x="390" y="585" font-size="16" fill="#555" text-anchor="middle">BUILD</text>
  <text x="400" y="545" font-size="14" fill="#777" font-style="italic">component1.js</text>

  <!-- 箭头 ui.frontend -> Vue Component -->
  <line x1="225" y1="575" x2="285" y2="616" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 箭头 Vue Component 1 -> AEM Component 1 的 Clientlib（构建产物 component1.js 挂载） -->
  <line x1="395" y1="600" x2="395" y2="478" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ========== ui.content 模块 ========== -->
  <rect x="55" y="670" width="170" height="65" fill="#c9a86c" rx="2"/>
  <text x="140" y="710" font-size="22" fill="#fff" text-anchor="middle" font-weight="500">ui.content</text>

  <!-- I18N & 业务数据 (米色长条) -->
  <rect x="290" y="700" width="220" height="32" fill="#d7ccc8" rx="2"/>
  <text x="400" y="722" font-size="15" fill="#5d4037" text-anchor="middle">I18N &amp; 业务数据</text>

  <!-- 箭头 ui.content -> I18N -->
  <line x1="225" y1="705" x2="285" y2="716" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ========== 中间 <component> 标签框 ========== -->
  <!-- 粉色圆圈 2 -->
  <circle cx="560" cy="400" r="22" fill="#f48fb1"/>
  <text x="560" y="408" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">2</text>

  <!-- component 标签框 (折角便签样式) -->
  <path d="M 580 380 L 740 380 L 740 470 L 700 490 L 580 490 Z" fill="#fafafa" stroke="#999" stroke-width="1.5"/>
  <text x="660" y="415" font-size="16" fill="#333" text-anchor="middle" font-family="monospace">&lt;component</text>
  <text x="660" y="440" font-size="16" fill="#333" text-anchor="middle" font-family="monospace">:value&gt;</text>
  <text x="660" y="465" font-size="16" fill="#333" text-anchor="middle" font-family="monospace">&lt;/component&gt;</text>

  <!-- 箭头 build -> component -->
  <line x1="510" y1="450" x2="575" y2="430" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- 箭头 component -> render -->
  <line x1="740" y1="430" x2="830" y2="430" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 箭头 Sling Model 1 -> component 便签右上（:value 数据注入） -->
  <line x1="450" y1="295" x2="680" y2="390" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- 箭头 I18N & 业务数据 -> component 便签右下（业务/国际化数据注入） -->
  <line x1="510" y1="716" x2="680" y2="495" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>



  <!-- ========== Render 区域外框 ========== -->
  <rect x="790" y="120" width="580" height="720" fill="none" stroke="#e8a0a0" stroke-width="2.5" rx="4"/>
  <text x="1080" y="175" font-size="44" font-weight="500" fill="#555" text-anchor="middle">render</text>

  <!-- ========== Page 卷轴形状 ========== -->
  <!-- 卷轴主体 -->
  <rect x="870" y="260" width="420" height="420" fill="#f5f5f5" stroke="#888" stroke-width="2" rx="10"/>
  <!-- 顶部 page 标签 -->
  <rect x="920" y="250" width="320" height="40" fill="#f5f5f5" stroke="#888" stroke-width="2" rx="8"/>
  <text x="1080" y="277" font-size="22" fill="#555" text-anchor="middle" font-style="italic">page</text>

  <!-- body id=app 行 -->
  <text x="890" y="320" font-size="15" fill="#555" font-family="monospace">&lt;body id=app&gt;</text>
  <line x1="1090" y1="315" x2="1030" y2="315" stroke="#666" stroke-width="1" marker-end="url(#arrowSmall)"/>
  <text x="1095" y="320" font-size="15" fill="#555">Vue initialized</text>

  <!-- AEM Component 2 (绿) -->
  <rect x="970" y="350" width="220" height="32" fill="#4caf50" rx="4"/>
  <text x="1080" y="372" font-size="15" fill="#fff" text-anchor="middle">AEM Component 2</text>

  <!-- 粉色圆圈 4 -->
  <circle cx="895" cy="425" r="22" fill="#f48fb1"/>
  <text x="895" y="433" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">4</text>

  <!-- AEM Component 1 (蓝) -->
  <rect x="970" y="410" width="220" height="32" fill="#4fc3f7" rx="4"/>
  <text x="1080" y="432" font-size="15" fill="#fff" text-anchor="middle">AEM Component 1</text>

  <!-- Vue component render using component tag -->
  <text x="1195" y="455" font-size="16" fill="#335" text-anchor="middle">Vue component render</text>
  <text x="1195" y="478" font-size="16" fill="#335" text-anchor="middle">using component tag</text>

  <!-- 白色省略号长条 -->
  <rect x="970" y="500" width="220" height="32" fill="#fff" stroke="#ddd" stroke-width="1" rx="4"/>
  <text x="1080" y="522" font-size="16" fill="#999" text-anchor="middle">···</text>

  <!-- /body -->
  <text x="890" y="595" font-size="15" fill="#555" font-family="monospace">&lt;/body&gt;</text>

  <!-- 底部卷轴装饰 (两个卷) -->
  <ellipse cx="890" cy="660" rx="18" ry="14" fill="#bdbdbd"/>
  <ellipse cx="1270" cy="660" rx="18" ry="14" fill="#bdbdbd"/>
  <rect x="890" y="650" width="380" height="20" fill="#e0e0e0"/>

  <!-- 底部说明文字 -->
  <text x="1080" y="710" font-size="16" fill="#335" text-anchor="middle">Props responsible to get</text>
  <text x="1080" y="733" font-size="16" fill="#335" text-anchor="middle">values from sling model</text>

  <!-- 箭头：底部 props 文字 -> AEM Component 1 底部（props 数据注入） -->
  <line x1="1080" y1="695" x2="1080" y2="445" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- 箭头：右侧 Vue render 说明 -> AEM Component 1 右侧（component tag 渲染） -->
  <line x1="1250" y1="450" x2="1192" y2="426" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ========== 箭头定义 ========== -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
    <marker id="arrowSmall" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#666"/>
    </marker>
  </defs>
</svg>
